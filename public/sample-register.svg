<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Table & Room Lighting Gradients -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c7052" />
      <stop offset="35%" stop-color="#5a432d" />
      <stop offset="70%" stop-color="#3b2b1d" />
      <stop offset="100%" stop-color="#241910" />
    </linearGradient>

    <radialGradient id="windowLight" cx="15%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#fff5e0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#d4b896" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Paper Texture & Shading -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#faf5e7" />
      <stop offset="40%" stop-color="#f5eedc" />
      <stop offset="85%" stop-color="#ede3cc" />
      <stop offset="100%" stop-color="#ded0b4" />
    </linearGradient>

    <!-- Page Curl / Book Spine Shadow -->
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55" />
      <stop offset="15%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#150e09" flood-opacity="0.6" />
    </filter>

    <filter id="penShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="8" flood-color="#110d0a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Wooden Table Background -->
  <rect width="1920" height="1080" fill="url(#bgLight)" />
  
  <!-- Subtle wood plank lines -->
  <line x1="0" y1="120" x2="1920" y2="120" stroke="#4a3725" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#3d2c1c" stroke-width="3" opacity="0.7"/>
  <line x1="0" y1="780" x2="1920" y2="780" stroke="#2a1e13" stroke-width="3" opacity="0.7"/>

  <!-- Window sunlight overlay -->
  <rect width="1920" height="1080" fill="url(#windowLight)" />

  <!-- Out-of-focus background papers / window sill edge -->
  <polygon points="0,0 600,0 520,240 0,180" fill="#dfd6c3" opacity="0.35" />
  <rect x="0" y="0" width="550" height="70" fill="#2d1f14" opacity="0.8" />

  <!-- Main Open Register Book in Perspective -->
  <g filter="url(#dropShadow)">
    <!-- Book cover back edge -->
    <polygon points="120,950 160,980 1880,940 1850,910" fill="#9e623b" />
    
    <!-- Left page edge curled under -->
    <polygon points="20,220 180,240 160,970 0,940" fill="#ede0c5" opacity="0.9" />

    <!-- Open Right Page (Primary Register) -->
    <polygon points="175,238 1850,205 1860,940 155,972" fill="url(#paperGrad)" />

    <!-- Spine Shadow on left side of page -->
    <polygon points="175,238 340,240 320,970 155,972" fill="url(#spineShadow)" />
  </g>

  <!-- Paper Page Inner Content Area -->
  <!-- Top table horizontal boundary line -->
  <line x1="210" y1="310" x2="1820" y2="280" stroke="#524330" stroke-width="2.5" />
  <!-- Under-header horizontal line -->
  <line x1="205" y1="365" x2="1825" y2="335" stroke="#524330" stroke-width="2" />

  <!-- Column dividing vertical lines -->
  <line x1="490" y1="310" x2="475" y2="880" stroke="#63523d" stroke-width="1.8" />
  <line x1="970" y1="300" x2="960" y2="880" stroke="#63523d" stroke-width="1.8" />
  <line x1="1170" y1="295" x2="1160" y2="880" stroke="#63523d" stroke-width="1.8" />
  <line x1="1390" y1="290" x2="1380" y2="880" stroke="#63523d" stroke-width="1.8" />
  <line x1="1580" y1="285" x2="1570" y2="880" stroke="#63523d" stroke-width="1.8" />

  <!-- Horizontal Rows (Light blue ledger lines) -->
  <line x1="195" y1="425" x2="1830" y2="395" stroke="#a0b3cc" stroke-width="1.2" />
  <line x1="190" y1="485" x2="1835" y2="455" stroke="#a0b3cc" stroke-width="1.2" />
  <line x1="185" y1="545" x2="1840" y2="515" stroke="#a0b3cc" stroke-width="1.2" />
  <line x1="180" y1="605" x2="1845" y2="575" stroke="#a0b3cc" stroke-width="1.2" />
  <line x1="175" y1="665" x2="1850" y2="635" stroke="#a0b3cc" stroke-width="1.2" />
  <line x1="170" y1="725" x2="1855" y2="695" stroke="#a0b3cc" stroke-width="1.2" />
  <line x1="165" y1="785" x2="1860" y2="755" stroke="#a0b3cc" stroke-width="1.2" />
  <line x1="160" y1="845" x2="1860" y2="815" stroke="#a0b3cc" stroke-width="1.2" />

  <!-- Double bottom ruling line -->
  <line x1="155" y1="885" x2="1860" y2="855" stroke="#1d3d75" stroke-width="2.5" />
  <line x1="155" y1="892" x2="1860" y2="862" stroke="#1d3d75" stroke-width="1.5" />

  <!-- Printed Header Typography -->
  <g font-family="'Noto Sans', 'Segoe UI', sans-serif" font-weight="bold" fill="#302619" text-anchor="middle">
    <text x="350" y="338" font-size="20" letter-spacing="1">DATE</text>
    <text x="350" y="358" font-size="16" font-weight="normal">(दिनांक)</text>

    <text x="730" y="333" font-size="20" letter-spacing="1">MEDICINE</text>
    <text x="730" y="353" font-size="16" font-weight="normal">(दवाई)</text>

    <text x="1070" y="328" font-size="19" letter-spacing="0.5">OPENING</text>
    <text x="1070" y="348" font-size="15" font-weight="normal">(ओपनिंग)</text>

    <text x="1280" y="324" font-size="19" letter-spacing="0.5">RECEIVED</text>
    <text x="1280" y="344" font-size="15" font-weight="normal">(प्राप्त)</text>

    <text x="1485" y="320" font-size="19" letter-spacing="0.5">ISSUED</text>
    <text x="1485" y="340" font-size="15" font-weight="normal">(जारी)</text>

    <text x="1700" y="315" font-size="19" letter-spacing="0.5">BALANCE</text>
    <text x="1700" y="335" font-size="15" font-weight="normal">(बाकी)</text>
  </g>

  <!-- Blue Ballpoint Pen Handwriting Entries -->
  <g font-family="'DejaVu Sans', 'Liberation Sans', cursive, sans-serif" fill="#133682" font-size="28" font-weight="600">
    <!-- Row 1: 29-09-2026 | Metformin 500 (मेटफॉर्मिन) -->
    <text x="260" y="415">29-09-2026</text>
    <text x="510" y="412">Metformin 500 (मेटफॉर्मिन)</text>
    <text x="1055" y="408">40</text>
    <text x="1265" y="405">--</text>
    <text x="1475" y="402">4</text>
    <text x="1690" y="398">36</text>

    <!-- Row 2: 29-09-2026 | Paracetamol 500 (पैरासिटामोल) -->
    <text x="255" y="475">29-09-2026</text>
    <text x="505" y="472">Paracetamol 500 (पैरासिटामोल)</text>
    <text x="1045" y="468">245</text>
    <text x="1265" y="465">--</text>
    <text x="1465" y="462">35</text>
    <text x="1680" y="458">210</text>

    <!-- Row 3: 29-09-2026 | ORS sachets (ओआरएस) -->
    <text x="250" y="535">29-09-2026</text>
    <text x="500" y="532">ORS sachets (ओआरएस)</text>
    <text x="1055" y="528">64</text>
    <text x="1250" y="525">100</text>
    <text x="1465" y="522">25</text>
    <text x="1680" y="518">139</text>

    <!-- Row 4: 29-09-2026 | Amlodipine 5 (एम्लोडिपाइन) -->
    <text x="245" y="595">29-09-2026</text>
    <text x="495" y="592">Amlodipine 5 (एम्लोडिपाइन)</text>
    <text x="1045" y="588">102</text>
    <text x="1265" y="585">--</text>
    <text x="1465" y="582">12</text>
    <text x="1690" y="578">90</text>

    <!-- Row 5: 30-09-2026 | IFA tablets (आईएफए) -->
    <text x="235" y="655">30-09-2026</text>
    <text x="490" y="652">IFA tablets (आईएफए)</text>
    <text x="1045" y="648">300</text>
    <text x="1265" y="645">--</text>
    <text x="1465" y="642">18</text>
    <text x="1675" y="638">282</text>

    <!-- Row 6: 30-09-2026 | Zinc 20 (जिंक) -->
    <text x="230" y="715">30-09-2026</text>
    <text x="485" y="712">Zinc 20 (जिंक)</text>
    <text x="1055" y="708">45</text>
    <text x="1265" y="705">--</text>
    <text x="1475" y="702">9</text>
    <text x="1690" y="698">36</text>

    <!-- Row 7: (30-09-2026 | Paracetamol 500 (पैरासिटामोल) with crossed out 14 -> 16 -->
    <text x="220" y="775">(30-09-2026</text>
    <text x="480" y="772">Paracetamol 500 (पैरासिटामोल)</text>
    <text x="1045" y="768">210</text>
    <text x="1265" y="765">--</text>
    
    <!-- Crossed out 14 -->
    <g transform="translate(1445, 765)">
      <text x="0" y="0" font-size="28" fill="#153b8c">14</text>
      <line x1="-5" y1="-8" x2="35" y2="-12" stroke="#133682" stroke-width="3.5" />
      <line x1="-2" y1="-15" x2="32" y2="-5" stroke="#133682" stroke-width="3" />
      <text x="45" y="0" font-size="30" font-weight="bold" fill="#0c2b70">16</text>
    </g>

    <!-- Balance: 194 -->
    <text x="1675" y="758">194</text>
  </g>

  <!-- Blue Ballpoint Pen (BIC Style) resting across the page -->
  <g filter="url(#penShadow)" transform="translate(930, 680) rotate(-14)">
    <polygon points="120,-8 750,-8 750,8 120,8" fill="#e8f2fc" opacity="0.85" stroke="#b0cde8" stroke-width="0.8" />
    <polygon points="120,-4 750,-4 750,4 120,4" fill="#ffffff" opacity="0.6" />
    <rect x="130" y="-2" width="600" height="4" fill="#0d3580" rx="1.5" />

    <polygon points="120,-8 50,-5 50,5 120,8" fill="#0c4299" />
    <polygon points="50,-5 20,-2 20,2 50,5" fill="#d9be79" stroke="#9e8446" stroke-width="0.5" />
    <circle cx="18" cy="0" r="2.2" fill="#c0c0c0" />

    <rect x="750" y="-9" width="70" height="18" fill="#0b3882" rx="3" />
    <path d="M 800 -9 L 800 -14 L 710 -13 L 715 -9 Z" fill="#092f6e" />
    <text x="400" y="3" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0b3882" opacity="0.8">BIC</text>
  </g>

  <!-- Signature and Verification at Bottom Right -->
  <g font-family="'DejaVu Sans', 'Liberation Sans', cursive, sans-serif" transform="translate(1480, 890)">
    <text x="0" y="0" font-size="28" fill="#133682" font-weight="bold">Total Checked</text>
    <text x="130" y="35" font-size="34" fill="#102f75" font-weight="bold" transform="rotate(-6)">R.K. Yadav</text>
    <text x="210" y="70" font-size="24" fill="#133682" font-weight="600">30/09/2026</text>
  </g>
</svg>